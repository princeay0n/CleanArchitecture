name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore CleanArchitecture.slnx

      - name: Build solution
        run: |
          dotnet build CleanArchitecture.slnx \
            --configuration Release \
            --no-restore
            
      - name: Install Playwright Chromium
        run: |
          pwsh ./artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium            
      

      - name: Run tests
        run: |
          dotnet test CleanArchitecture.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal
            
  frontend-image:
    name: Build Frontend Docker Image
    needs: build-and-test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/ClientApp/package-lock.json

      - name: Build Web project
        run: |
          dotnet restore src/Web/Web.csproj
          dotnet build src/Web/Web.csproj \
            --configuration Release \
            --no-restore

      - name: Install frontend dependencies
        working-directory: src/Web/ClientApp
        run: npm ci

      - name: Build Angular frontend
        working-directory: src/Web/ClientApp
        run: npm run build -- --configuration production

      - name: Show Git commit SHA
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Image: frontend:${GITHUB_SHA}"

      - name: Build frontend Docker image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag frontend:${GITHUB_SHA} \
            .

      - name: Show frontend Docker image
        run: |
          docker images frontend:${GITHUB_SHA}         
            
  backend-image:
    name: Build Backend Docker Image
    needs: build-and-test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Git commit SHA
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Image: backend:${GITHUB_SHA}"

      - name: Build backend Docker image
        run: |
          docker build \
            --file Dockerfile.backend \
            --tag backend:${GITHUB_SHA} \
            .

      - name: Show backend Docker image
        run: |
          docker images backend:${GITHUB_SHA}
