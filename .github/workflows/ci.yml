name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  azure-oidc-test:
    name: Test Azure OIDC Login
    needs: build-and-test
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: |
          az account show \
            --query "{Subscription:name,State:state}" \
            --output table
            
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore CleanArchitecture.slnx

      - name: Build solution
        run: |
          dotnet build CleanArchitecture.slnx \
            --configuration Release \
            --no-restore
            
      - name: Install Playwright Chromium
        run: |
          pwsh ./artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium            
      

      - name: Run tests
        run: |
          dotnet test CleanArchitecture.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal
            
  frontend-image:
    name: Build Frontend Docker Image
    needs: build-and-test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Web/ClientApp/package-lock.json

      - name: Build Web project
        run: |
          dotnet restore src/Web/Web.csproj
          dotnet build src/Web/Web.csproj \
            --configuration Release \
            --no-restore

      - name: Install frontend dependencies
        working-directory: src/Web/ClientApp
        run: npm ci

      - name: Build Angular frontend
        working-directory: src/Web/ClientApp
        run: npm run build -- --configuration production

      - name: Show Git commit SHA
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Image: frontend:${GITHUB_SHA}"

      - name: Build frontend Docker image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag frontend:${GITHUB_SHA} \
            .

      - name: Show frontend Docker image
        run: |
          docker images frontend:${GITHUB_SHA}         
            
  backend-image:
    name: Build Backend Docker Image
    needs: build-and-test
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name ${{ vars.ACR_NAME }} \
            --query loginServer \
            --output tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV
          echo "ACR Login Server: $ACR_LOGIN_SERVER"

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Show Git commit SHA
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Image: ${ACR_LOGIN_SERVER}/backend:${GITHUB_SHA}"

      - name: Build backend Docker image
        run: |
          docker build \
            --file Dockerfile.backend \
            --tag ${ACR_LOGIN_SERVER}/backend:${GITHUB_SHA} \
            .

      - name: Show backend Docker image
        run: |
          docker images ${ACR_LOGIN_SERVER}/backend:${GITHUB_SHA}

      - name: Push backend Docker image
        run: |
          docker push ${ACR_LOGIN_SERVER}/backend:${GITHUB_SHA}
